research_questions:
  - "What structured information must be retained to reconstruct why a historically situated AI-mediated decision was justified, authorized, and valid at the time it was made?"
  - "Which existing architectural abstractions (logging, provenance, policy, workflow, tracing, etc.) already preserve that information, and under what conditions?"
  - "If a gap remains, is it best framed as missing data, missing binding between artifacts, missing temporal semantics, or missing normative criteria—and does closing it require a new layer or disciplined composition of existing ones?"
  - "How should candidate formulations (Decision Knowledge, Justification, Decision Integrity, Decision Reconstruction) be compared without presupposing that a new layer is necessary?"
