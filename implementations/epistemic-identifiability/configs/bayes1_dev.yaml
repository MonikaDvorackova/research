# DEVELOPMENT configuration for the Bayesian observer on environment 1. Exploratory: used to debug and to check sanity (Gate 2).
# Development seeds are 200-204; confirmatory seeds (300-311) are reserved and are not run until the configuration is frozen.
seeds: [200, 201, 202, 203, 204]
R: 30
steps: 80
episode_len: 10
checkpoints: [10, 20, 40, 80]
regimes: [oracle, learned, bma]
policies: [passive, wide, sweep, eig]
q_train_n: 5000
w_train_n: 12500
train_steps: 1500
q_amp: 1.0
