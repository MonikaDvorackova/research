<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="122mm" height="68mm" viewBox="0 0 488 272" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual model for Knowledge Continuity</title>
  <desc id="desc">Layered diagram showing an operational decision path, capture points, a Decision Knowledge artifact, continuity services for retention and access, and a separate change plane whose updates are blocked from altering retained Decision Knowledge.</desc>
  <defs>
    <pattern id="changeHatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M0,6 L6,0" stroke="#777" stroke-width="0.55"/>
    </pattern>
    <marker id="arrDown" markerWidth="7" markerHeight="7" refX="3.5" refY="6" orient="auto">
      <polygon points="0 0, 7 0, 3.5 7" fill="#111"/>
    </marker>
    <marker id="arrRight" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#111"/>
    </marker>
    <marker id="arrBlock" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="3.2" fill="#fff" stroke="#111" stroke-width="1.2"/>
      <line x1="2" y1="2" x2="6" y2="6" stroke="#111" stroke-width="1.2"/>
      <line x1="6" y1="2" x2="2" y2="6" stroke="#111" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="244" y="16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#111">Conceptual model (not a product architecture)</text>

  <!-- Change plane -->
  <rect x="12" y="26" width="464" height="36" fill="url(#changeHatch)" stroke="#111" stroke-width="1.2" stroke-dasharray="4 2" rx="1"/>
  <rect x="18" y="30" width="168" height="28" fill="#fff" stroke="none"/>
  <rect x="348" y="34" width="118" height="18" fill="#fff" stroke="none"/>
  <text x="24" y="42" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#111">Change plane (existing)</text>
  <text x="24" y="54" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#333">model / index / tool / policy updates</text>
  <text x="360" y="48" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#111">must not rewrite --&gt;</text>

  <!-- Blocked arrow to artifact -->
  <line x1="430" y1="62" x2="430" y2="118" stroke="#111" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#arrBlock)"/>

  <!-- Decision path -->
  <rect x="12" y="72" width="464" height="34" fill="#fff" stroke="#111" stroke-width="1.2" rx="1"/>
  <text x="24" y="88" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#111">Decision path (existing)</text>
  <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#333">inference / retrieval / tool use / policy checks / human gating</text>

  <!-- Capture points -->
  <rect x="12" y="116" width="464" height="48" fill="#fff" stroke="#111" stroke-width="1.2" rx="1"/>
  <text x="24" y="132" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#111">Capture points</text>
  <!-- small boxes -->
  <rect x="24" y="140" width="68" height="18" fill="#fff" stroke="#111" stroke-width="0.9" rx="1"/>
  <text x="58" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#111">prompt</text>
  <rect x="98" y="140" width="68" height="18" fill="#fff" stroke="#111" stroke-width="0.9" rx="1"/>
  <text x="132" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#111">retrieval</text>
  <rect x="172" y="140" width="68" height="18" fill="#fff" stroke="#111" stroke-width="0.9" rx="1"/>
  <text x="206" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#111">tool</text>
  <rect x="246" y="140" width="68" height="18" fill="#fff" stroke="#111" stroke-width="0.9" rx="1"/>
  <text x="280" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#111">policy eval</text>
  <rect x="320" y="140" width="68" height="18" fill="#fff" stroke="#111" stroke-width="0.9" rx="1"/>
  <text x="354" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#111">human gate</text>
  <rect x="394" y="140" width="70" height="18" fill="#fff" stroke="#111" stroke-width="0.9" rx="1"/>
  <text x="429" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#111">outcome</text>

  <!-- Mechanisms strip -->
  <text x="244" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#111">Capture -&gt; Binding -&gt; Retention</text>
  <line x1="244" y1="166" x2="244" y2="170" stroke="#111" stroke-width="1.2" marker-end="url(#arrDown)"/>

  <!-- Decision Knowledge artifact -->
  <rect x="100" y="188" width="288" height="36" fill="#fff" stroke="#111" stroke-width="2.4" rx="2"/>
  <rect x="104" y="192" width="280" height="28" fill="none" stroke="#111" stroke-width="0.6" rx="1"/>
  <text x="244" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#111">Decision Knowledge artifact</text>

  <!-- Continuity services -->
  <line x1="244" y1="224" x2="244" y2="232" stroke="#111" stroke-width="1.2" marker-end="url(#arrDown)"/>
  <rect x="12" y="234" width="464" height="28" fill="#fff" stroke="#111" stroke-width="1.2" rx="1"/>
  <text x="24" y="252" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#111">Continuity services</text>
  <text x="160" y="252" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#333">retention / integrity / access control / retrieval for explain / justify / review / contest</text>
</svg>
