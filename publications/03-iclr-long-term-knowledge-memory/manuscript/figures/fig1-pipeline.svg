<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220">
  <style>
    .box { fill:#f5f5f5; stroke:#222; stroke-width:1.5; }
    .t { font-family:Helvetica,Arial,sans-serif; font-size:13px; text-anchor:middle; }
    .title { font-family:Helvetica,Arial,sans-serif; font-size:15px; font-weight:bold; text-anchor:middle; }
  </style>
  <text class="title" x="490" y="28">WorldConsistMem evaluation pipeline</text>
  <rect class="box" x="20" y="60" width="140" height="90" rx="8"/>
  <text class="t" x="90" y="95">Evolving world</text>
  <text class="t" x="90" y="115">W0:T</text>
  <text class="t" x="170" y="108">→</text>
  <rect class="box" x="190" y="60" width="140" height="90" rx="8"/>
  <text class="t" x="260" y="95">Observation</text>
  <text class="t" x="260" y="115">stream O1:T</text>
  <text class="t" x="340" y="108">→</text>
  <rect class="box" x="360" y="60" width="140" height="90" rx="8"/>
